            --mystic-purple: #2a1b40;
            --cosmic-glow: rgba(157, 78, 221, 0.35);

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(74, 20, 140, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(255, 158, 44, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(123, 44, 191, 0.2) 0%, transparent 40%);

            min-height: 100vh;

            padding: 1rem;
            position: relative;

        /* Celestial / Tarot Decorative Frame Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(229, 169, 60, 0.4);
            outline: 2px solid rgba(229, 169, 60, 0.2);
            outline-offset: 4px;
            pointer-events: none;
            z-index: 999;
        }

        .corner-star {
            position: fixed;
            color: var(--gold-primary);
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 1000;
        }
        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 2rem 1rem;
            position: relative;
            z-index: 10;
        }

        /* Header / Logo Styling matching Flyer */
        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            position: relative;
        }

        /* Floating Eye Logo with Interactive Hover Animation */
        .flyer-logo-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.6) 0%, rgba(20, 10, 35, 0.9) 70%);
            border: 3px solid var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.8), inset 0 0 15px rgba(255, 158, 44, 0.5);
            animation: float-eerie 4s ease-in-out infinite;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .flyer-logo-icon svg {
            width: 80px;
            height: 80px;
            transition: transform 0.4s ease;
        }

        /* Eyelid Styling for Blink Effect */
        .eyelid {
            transform-origin: 50% 15px;
            transition: transform 0.25s ease-in-out;
        }

        /* Floating animation */
        @keyframes float-eerie {
            0% { transform: translateY(0px) rotate(0deg); box-shadow: 0 5px 20px rgba(157, 78, 221, 0.7); }

            100% { transform: translateY(0px) rotate(0deg); box-shadow: 0 5px 20px rgba(157, 78, 221, 0.7); }
        }
