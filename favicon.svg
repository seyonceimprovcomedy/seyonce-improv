<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="orb" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#e6c8ff"/>
      <stop offset=".34" stop-color="#8652c7"/>
      <stop offset=".72" stop-color="#35105f"/>
      <stop offset="1" stop-color="#100718"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0a6"/>
      <stop offset=".38" stop-color="#d99b32"/>
      <stop offset=".72" stop-color="#8d5015"/>
      <stop offset="1" stop-color="#f6d779"/>
    </linearGradient>
    <radialGradient id="iris" cx="38%" cy="30%" r="70%">
      <stop stop-color="#fff4d6"/>
      <stop offset=".22" stop-color="#ff8b73"/>
      <stop offset=".48" stop-color="#f02f3f"/>
      <stop offset=".82" stop-color="#a31328"/>
      <stop offset="1" stop-color="#510b22"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#ff443f" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#ed254d" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ed254d" stop-opacity="0"/>
    </radialGradient>
    <filter id="eyeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#09050e"/>
